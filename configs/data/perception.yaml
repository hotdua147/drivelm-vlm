# Paths and data options shared by every experiment
paths:
  drivelm_json: data/raw/drivelm/v1_1_train_nus.json   # DriveLM-nuScenes v1.1 (Hugging Face OpenDriveLab/DriveLM)
  nusc_root: data/raw/nuscenes          # holds v1.0-trainval/*.json and samples/
  nusc_version: v1.0-trainval
  image_root: data/raw/nuscenes         # DriveLM image paths are rewritten to samples/<CAM>/<file>.jpg
  processed: data/processed
  runs_dir: runs
data:
  categories: [perception]
  cameras: [CAM_FRONT_LEFT, CAM_FRONT, CAM_FRONT_RIGHT, CAM_BACK_LEFT, CAM_BACK, CAM_BACK_RIGHT]
  val_frac: 0.1
  seed: 0
  n_val_fixed: 700                      # stratified: 100 per scored question type
  data_version: d1
  cell: [448, 252]                      # per-camera resolution fed to the model
  thresholds: {}                        # override label-check thresholds here
eval:
  taus: [50, 100, 200]
  halluc_dist: 100
seed: 0
